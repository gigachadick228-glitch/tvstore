<body>
    <header>
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo">
                    <img src="https://cdn-icons-png.flaticon.com/512/1170/1170688.png" alt="Логотип" width="32" height="32"> ЭкранПро

    <main>
        <div class="container">
            <h1>Регистрация</h1>
            <section class="feedback-form" style="max-width: 400px;">
                <form id="register-form">
                    <label for="reg-username">Имя пользователя:</label>
                    <input type="text" id="reg-username" required placeholder="Придумайте логин">

                    <label for="reg-password">Пароль:</label>
                    <input type="password" id="reg-password" required placeholder="Минимум 4 символа">

                    <button type="submit" class="btn">Зарегистрироваться</button>
                </form>
                <div id="reg-result"></div>
                <p style="margin-top: 15px;">Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </section>
        </div>
    </main>
